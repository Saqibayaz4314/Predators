# Frontend static server + API reverse proxy.
# The browser talks to this single origin; /api traffic is forwarded to the
# backend Service inside the cluster (same namespace).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API traffic -> Fastify backend.
    # Resolver + variable keeps nginx starting even if the backend Service
    # does not resolve yet; requests get 502 until it is available.
    location /api/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
        set $backend http://flood-backend-service.flood-digital-twin.svc.cluster.local:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Routing + graph operations can take a while on first load.
        proxy_read_timeout 120s;
    }

    # Health/readiness pass-through for deployment smoke tests.
    location = /health {
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
        set $backend http://flood-backend-service.flood-digital-twin.svc.cluster.local:3001;
        proxy_pass $backend;
        proxy_read_timeout 10s;
    }
    location = /ready {
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
        set $backend http://flood-backend-service.flood-digital-twin.svc.cluster.local:3001;
        proxy_pass $backend;
        proxy_read_timeout 10s;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
