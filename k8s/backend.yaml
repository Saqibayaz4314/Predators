apiVersion: apps/v1
kind: Deployment
metadata:
  name: flood-backend
  namespace: flood-digital-twin
  labels:
    app: flood-backend
    app.kubernetes.io/part-of: flood-digital-twin
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flood-backend
  template:
    metadata:
      labels:
        app: flood-backend
    spec:
      containers:
      - name: backend
        image: FLOOD_BACKEND_IMAGE
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3001
        envFrom:
        - configMapRef:
            name: flood-config
        - secretRef:
            name: flood-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          # /ready is 503 until DB + PostGIS + dataset + graph cache are loaded
          # (graph load from the Heroku database takes up to ~100s cold).
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: flood-backend-service
  namespace: flood-digital-twin
  labels:
    app: flood-backend
    app.kubernetes.io/part-of: flood-digital-twin
spec:
  type: ClusterIP
  selector:
    app: flood-backend
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
