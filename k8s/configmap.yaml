apiVersion: v1
kind: ConfigMap
metadata:
  name: flood-config
  namespace: flood-digital-twin
  labels:
    app.kubernetes.io/part-of: flood-digital-twin
data:
  # Non-sensitive runtime settings only. Secrets belong in flood-secrets.
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "3001"
  LOG_LEVEL: "info"
  # CORS_ORIGIN: unset by default — the browser talks to the API through the
  # frontend nginx reverse proxy (same origin), so cross-origin requests are
  # not expected. Set it to the public URL if direct cross-origin access is
  # ever required.
  # Optional AI explanation engine (DigitalOcean hosted inference).
  # The API key belongs in flood-secrets; these settings are non-sensitive.
  # If the key is absent the backend serves deterministic fallbacks only.
  DO_GPT_OSS_MODEL: "openai-gpt-oss-120b"
  DO_INFERENCE_URL: "https://inference.do-ai.run/v1/chat/completions"
  AI_TIMEOUT_MS: "12000"
  AI_MAX_OUTPUT_TOKENS: "1000"
  AI_TEMPERATURE: "0.2"
