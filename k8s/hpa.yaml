apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flood-frontend-hpa
  namespace: flood-digital-twin
  labels:
    app: flood-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flood-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flood-backend-hpa
  namespace: flood-digital-twin
  labels:
    app: flood-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flood-backend
  # The backend holds an in-memory graph cache per pod and uses a small
  # bounded Heroku connection pool, so keep horizontal scaling conservative.
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
