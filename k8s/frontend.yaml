apiVersion: apps/v1
kind: Deployment
metadata:
  name: flood-frontend
  namespace: flood-digital-twin
  labels:
    app: flood-frontend
    app.kubernetes.io/part-of: flood-digital-twin
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flood-frontend
  template:
    metadata:
      labels:
        app: flood-frontend
    spec:
      containers:
      - name: frontend
        image: FLOOD_FRONTEND_IMAGE
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: flood-frontend-service
  namespace: flood-digital-twin
  labels:
    app: flood-frontend
    app.kubernetes.io/part-of: flood-digital-twin
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: flood-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
