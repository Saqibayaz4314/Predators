# REFERENCE TEMPLATE ONLY — NEVER COMMIT REAL VALUES.
#
# The real secret is created at deploy time by the CI/CD pipeline from
# GitHub Actions secrets (see .github/workflows/deploy.yaml) and never
# stored in this repository:
#
#   kubectl create secret generic flood-secrets -n flood-digital-twin \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Manual alternative (values never stored in git):
#
#   kubectl create secret generic flood-secrets -n flood-digital-twin \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/DB'
#
# This example file is intentionally not applied by the pipeline.
apiVersion: v1
kind: Secret
metadata:
  name: flood-secrets
  namespace: flood-digital-twin
  labels:
    app.kubernetes.io/part-of: flood-digital-twin
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_REAL_HEROKU_POSTGIS_URL_OR_DO_NOT_APPLY"
