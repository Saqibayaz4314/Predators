name: Deploy Flood Digital Twin

# Trigger automated AWS EKS deployment pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  EKS_CLUSTER_NAME: flood-digital-twin-eks
  K8S_NAMESPACE: flood-digital-twin
  ECR_FRONTEND_REPO: flood-digital-twin-frontend
  ECR_BACKEND_REPO: flood-digital-twin-backend

jobs:
  build-provision-and-deploy:
    name: Build, Provision & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Required GitHub secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
      # GitHub encrypts secrets at rest and masks their values in logs; the
      # keys are injected only at job runtime and never printed by any step.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      - name: Ensure S3 Remote State Bucket
        id: s3-state
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            BUCKET="flood-digital-twin-tfstate-${ACCOUNT_ID}-${{ env.AWS_REGION }}"
          fi
          echo "Using Terraform state bucket: $BUCKET"
          echo "BUCKET_NAME=$BUCKET" >> "$GITHUB_ENV"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET does not exist. Creating..."
            if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "${{ env.AWS_REGION }}" \
                --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "Bucket $BUCKET already exists."
          fi

      - name: Terraform Init & Apply
        id: terraform
        run: |
          cd terraform
          echo "==> Initializing Terraform with S3 backend..."
          terraform init \
            -reconfigure \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=flood-digital-twin/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

          echo "==> Applying Terraform infrastructure (VPC, ECR, EKS)..."
          terraform apply -auto-approve

          # Extract map outputs with -json + jq: terraform output does not
          # support map-index syntax in the NAME argument, and -raw only
          # works for string/number/boolean values.
          ECR_FRONTEND_URL=$(terraform output -json | jq -r '.ecr_repository_urls.value["flood-digital-twin-frontend"]')
          ECR_BACKEND_URL=$(terraform output -json | jq -r '.ecr_repository_urls.value["flood-digital-twin-backend"]')
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          if [ -z "$ECR_FRONTEND_URL" ] || [ -z "$ECR_BACKEND_URL" ] || [ -z "$CLUSTER_NAME" ]; then
            echo "::error::Failed to extract required values from Terraform outputs."
            exit 1
          fi
          echo "ECR_FRONTEND_URL=$ECR_FRONTEND_URL" >> "$GITHUB_ENV"
          echo "ECR_BACKEND_URL=$ECR_BACKEND_URL" >> "$GITHUB_ENV"
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> "$GITHUB_ENV"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_FRONTEND_URL }}:${{ github.sha }}
            ${{ env.ECR_FRONTEND_URL }}:frontend-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_BACKEND_URL }}:${{ github.sha }}
            ${{ env.ECR_BACKEND_URL }}:backend-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure Kubectl for EKS
        run: |
          aws eks update-kubeconfig --region "${{ env.AWS_REGION }}" \
            --name "${{ env.CLUSTER_NAME || env.EKS_CLUSTER_NAME }}"

      # The namespace must exist before the secret can be upserted;
      # applying it here (and again in the manifests step) is idempotent.
      # DATABASE_URL is passed via environment so the value never appears in
      # the step source; GitHub masks it in logs automatically.
      - name: Create Kubernetes Secret from GitHub Secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DO_GPT_OSS_API_KEY: ${{ secrets.DO_GPT_OSS_API_KEY }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          ARGS=()
          if [ -n "$DATABASE_URL" ]; then
            ARGS+=(--from-literal=DATABASE_URL="$DATABASE_URL")
          else
            echo "::warning::GitHub secret DATABASE_URL is not set — backend /ready will stay 503."
          fi
          if [ -n "$DO_GPT_OSS_API_KEY" ]; then
            ARGS+=(--from-literal=DO_GPT_OSS_API_KEY="$DO_GPT_OSS_API_KEY")
          else
            echo "::notice::GitHub secret DO_GPT_OSS_API_KEY is not set — AI explanations use the deterministic fallback."
          fi
          if [ ${#ARGS[@]} -gt 0 ]; then
            kubectl create secret generic flood-secrets -n "${{ env.K8S_NAMESPACE }}" \
              "${ARGS[@]}" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "Secret flood-secrets upserted."
          else
            echo "::warning::No secret material available; keeping any existing flood-secrets."
          fi

      - name: Deploy Kubernetes Manifests
        run: |
          FRONTEND_IMAGE="${{ env.ECR_FRONTEND_URL }}:${{ github.sha }}"
          BACKEND_IMAGE="${{ env.ECR_BACKEND_URL }}:${{ github.sha }}"
          echo "Deploying frontend image: $FRONTEND_IMAGE"
          echo "Deploying backend image : $BACKEND_IMAGE"

          # Substitute image placeholders in workspace copies; never mutate
          # the repository manifests. secrets.example.yaml is intentionally
          # not applied (the real secret was created in the previous step).
          cp k8s/frontend.yaml /tmp/frontend.yaml
          cp k8s/backend.yaml /tmp/backend.yaml
          sed -i "s|FLOOD_FRONTEND_IMAGE|${FRONTEND_IMAGE}|g" /tmp/frontend.yaml
          sed -i "s|FLOOD_BACKEND_IMAGE|${BACKEND_IMAGE}|g" /tmp/backend.yaml

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -n "${{ env.K8S_NAMESPACE }}" \
            -f k8s/configmap.yaml \
            -f /tmp/backend.yaml \
            -f /tmp/frontend.yaml \
            -f k8s/hpa.yaml \
            -f k8s/pdb.yaml

      - name: Wait for Rollouts
        run: |
          wait_for_rollout() {
            local resource=$1
            echo "==> Monitoring rollout for $resource..."
            if ! kubectl rollout status "$resource" -n "${{ env.K8S_NAMESPACE }}" --timeout=300s; then
              echo "ROLLOUT FAILED for $resource — diagnostics below."
              kubectl get pods -n "${{ env.K8S_NAMESPACE }}" -o wide
              kubectl describe pods -n "${{ env.K8S_NAMESPACE }}"
              kubectl logs -l app=flood-backend -n "${{ env.K8S_NAMESPACE }}" --tail=50 || true
              kubectl logs -l app=flood-frontend -n "${{ env.K8S_NAMESPACE }}" --tail=50 || true
              exit 1
            fi
            echo "Successfully rolled out $resource"
          }

          wait_for_rollout deployment/flood-backend
          wait_for_rollout deployment/flood-frontend

      - name: Verify Public Application
        run: |
          echo "Waiting for the AWS Load Balancer to provision an external address..."
          LB_HOST=""
          for i in $(seq 1 60); do
            LB_HOST=$(kubectl get svc flood-frontend-service -n "${{ env.K8S_NAMESPACE }}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$LB_HOST" ]; then
              LB_HOST=$(kubectl get svc flood-frontend-service -n "${{ env.K8S_NAMESPACE }}" \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$LB_HOST" ]; then
              echo "LoadBalancer address found: $LB_HOST"
              break
            fi
            echo "Waiting for LoadBalancer ingress address... ($i/60)"
            sleep 5
          done

          if [ -z "$LB_HOST" ]; then
            echo "Error: timed out waiting for LoadBalancer address."
            kubectl describe svc flood-frontend-service -n "${{ env.K8S_NAMESPACE }}"
            exit 1
          fi

          echo "Waiting for the frontend to serve content..."
          APP_CONTENT=""
          for i in $(seq 1 40); do
            APP_CONTENT=$(curl -sL -m 10 "http://$LB_HOST/" || true)
            if echo "$APP_CONTENT" | grep -qi "<html"; then
              echo "Frontend responded with HTML."
              break
            fi
            echo "Attempt $i/40: LoadBalancer warming up... waiting 6s"
            sleep 6
          done

          echo "Verifying backend health through the public entry point..."
          HEALTH_BODY=$(curl -s -m 15 "http://$LB_HOST/health" || true)
          echo "GET /health -> $HEALTH_BODY"

          echo "Verifying backend readiness inside the cluster..."
          kubectl exec deploy/flood-backend -n "${{ env.K8S_NAMESPACE }}" -- \
            wget -qO- --timeout=10 http://127.0.0.1:3001/ready || true

          {
            echo "## Flood Digital Twin Deployment Summary"
            echo ""
            echo "- **Public URL**: http://$LB_HOST/"
            echo "- **Frontend image**: \`${{ env.ECR_FRONTEND_URL }}:${{ github.sha }}\`"
            echo "- **Backend image**: \`${{ env.ECR_BACKEND_URL }}:${{ github.sha }}\`"
            echo "- **Cluster**: \`${{ env.CLUSTER_NAME || env.EKS_CLUSTER_NAME }}\`"
            echo "- **Namespace**: \`${{ env.K8S_NAMESPACE }}\`"
            echo ""
            echo "### Verification"
            echo ""
            echo "- Frontend: $(echo "$APP_CONTENT" | grep -qi '<html' && echo 'serving HTML' || echo 'NOT VERIFIED')"
            echo "- Backend /health: \`$HEALTH_BODY\`"
          } >> "$GITHUB_STEP_SUMMARY"
